<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>Pushdozer</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Pushdozer - Minecraft terrain editing mod documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    // GitHub Pages project site lives under /Pushdozer-Introduction/; local serve uses /
    const basePath = window.location.hostname.endsWith('github.io')
      ? '/Pushdozer-Introduction/'
      : '/';

    window.$docsify = {
      name: 'Pushdozer',
      repo: 'Theopote/Pushdozer_Mod',

      basePath: basePath,
      homepage: 'zh/README.md',

      loadSidebar: true,
      loadNavbar: true,
      relativePath: false,

      alias: {
        '/zh/.*/_sidebar.md': '/zh/_sidebar.md',
        '/en/.*/_sidebar.md': '/en/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },

      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,

      search: {
        paths: 'auto',
        placeholder: {
          '/zh/': '搜索',
          '/': 'Type to search'
        },
        noData: {
          '/zh/': '找不到结果',
          '/': 'No results!'
        }
      },

      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(content) {
            const path = vm.route.path;
            if (path.startsWith('/zh/') || path.startsWith('zh/')) {
              document.documentElement.lang = 'zh-cn';
            } else {
              document.documentElement.lang = 'en';
            }
            return content;
          });

          hook.mounted(function() {
            const path = vm.route.path;
            if (!path || path === '/') {
              window.location.replace(
                window.location.pathname + window.location.search + '#/zh/README.md'
              );
            }
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>

  <!-- Temporarily disabled for sidebar troubleshooting:
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">
  <script src="https://cdn.jsdelivr.net/npm/docsify-count@latest/dist/countable.min.js"></script>
  -->
</body>
</html>
