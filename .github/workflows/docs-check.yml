name: Docs Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Pushdozer_Mod for doc verification
        uses: actions/checkout@v4
        with:
          repository: Theopote/Pushdozer_Mod
          path: mod-source

      - name: Verify documentation consistency
        env:
          MOD_SOURCE: ${{ github.workspace }}/mod-source
        run: node scripts/verify-docs.mjs
