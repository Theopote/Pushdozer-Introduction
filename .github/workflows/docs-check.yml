name: Docs Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout Pushdozer_Mod for doc verification
        uses: actions/checkout@v4
        with:
          repository: Theopote/Pushdozer_Mod
          path: mod-source

      - name: Verify documentation consistency
        env:
          MOD_SOURCE: ${{ github.workspace }}/mod-source
        run: node scripts/verify-docs.mjs

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test documentation navigation
        run: npm run test:docs
